:root {

  --good: #7bc47f;
  --fg: #ece6d6;

  --display: 'Alfa Slab One', Georgia, serif;

* { box-sizing: border-box; }

}

.hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.stat span { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.stat b { font-size: 1.5rem; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat.gold b { color: var(--brass); }
.stat.life b { color: var(--foe); }

  position: sticky; bottom: 0; z-index: 5; background: var(--ink); border-top: 1px solid var(--line);

.info { padding: 6px; }

<main class="app">
  <header class="top">

    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
</main>

  function resize() {

    var fw = Math.max(1, fe.clientWidth), fh = Math.max(1, fe.clientHeight);

    var sx = fw / (cs * COLS), sy = fh / (cs * ROWS);

    cv.height = Math.round(fh * d);
    cv.style.width = fw + 'px';
    cv.style.height = fh + 'px';
    ctx.setTransform(d * sx, 0, 0, d * sy, 0, 0);

    bctx.setTransform(d * sx, 0, 0, d * sy, 0, 0);

  var state, towers, enemies, shots, fx, floats, queue, parts;
  var level = 1, unlocked = 1, lvPaused = false;

  var hintMsg = '', hintUntil = 0, banner = null, foeKey = '', spawnRt = 0;

  level = unlocked;

  function loadLevel(n) {
    level = n;
    buildMap(n);
    var spd = state ? state.speed : 1;
    state = { lives: 15, gold: 130 + 10 * (n - 1), wave: 0, cleared: 0, speed: spd, paused: false, over: false, spawnClock: 0, autoT: null };
    towers = []; enemies = []; shots = []; fx = []; floats = []; queue = []; parts = []; banner = null;
    sel = null; pending = null;

    try { document.getElementById('field').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 450 }); } catch (e2) { /* ignore */ }

  function towerAt(c, r) {

    return null;
  }
  function stats(t) { return TYPES[t.type].lv[t.lv]; }

  function effWave(w) { return (level - 1) * 0.9 + w * 0.9; }

  function waveGroups(w) {
    var E = effWave(w), groups = [];
    groups.push({ type: 'grunt', count: Math.min(48, 6 + Math.floor(E * 1.8)), gap: Math.max(0.38, 0.8 - E * 0.015) });
    if (E >= 2) groups.push({ type: 'runner', count: Math.min(26, Math.floor(E * 1.1)), gap: 0.45 });
    if (E >= 4) groups.push({ type: 'tank', count: Math.min(14, Math.floor((E - 2) / 1.5)), gap: 1.6 });
    if (E >= 7) groups.push({ type: 'knight', count: Math.min(10, Math.floor((E - 5) / 2)), gap: 1.4 });
    if (E >= 3.5) groups.push({ type: 'flyer', count: Math.min(14, Math.floor((E - 2) / 1.3)), gap: 0.8 });
    if (E >= 5) groups.push({ type: 'shield', count: Math.min(12, Math.floor((E - 3) / 1.6)), gap: 1.1 });
    if (w === WAVES) groups.push({ type: 'boss', count: 1 + Math.floor((level - 1) / 6), gap: 3.2 });

  }

  function buildWave(w) {

    waveGroups(w).forEach(function (g, gi) {

  }

  function startWave() {

    state.wave++;

    banner = { t: 0, text: waveGroups(state.wave).some(function (g) { return g.type === 'boss'; }) ? '⚠ SARDAAR AA RAHA HAI' : 'WAVE ' + state.wave + '/' + WAVES + (state.wave === WAVES ? ' · AAKHRI' : '') };
    sfx(banner.text.charAt(0) === '⚠' ? 'boss' : 'wave');

  function spawn(q) {
    var f = FOES[q.type];

    var rt = (spawnRt++) % RT.length, p = posAt(0, rt);

      rew: Math.round(f.rew * (1 + (q.E - 1) * 0.015)),
      x: p[0], y: p[1], ang: 0, ph: Math.random() * 6, flash: 0, slowT: 0, slowF: 1, dead: false, fly: !!f.fly, sh: f.shield ? hp * 0.7 : 0

  function burst(x, y, color, n, spd) {

    }
  }

  function damage(e, dmg) {
    if (e.dead) return;
    var d2 = Math.max(dmg * 0.35, dmg - e.def.armor);
    if (e.sh > 0) { e.sh -= d2; e.flash = 0.12; if (e.sh >= 0) return; d2 = -e.sh; e.sh = 0; }
    e.hp -= d2;
    e.flash = 0.12;

      e.dead = true;
      sfx(e.type === 'boss' ? 'bossdie' : 'die');
      state.gold += e.rew;
      floats.push({ x: e.x, y: e.y, t: 0, text: '+' + e.rew, color: col.brass });
      burst(e.x, e.y, e.def.c[1], e.type === 'boss' ? 22 : 9, 1.6);
    }
  }

  function fire(t, target) {
    var s = stats(t), def = TYPES[t.type];
    shots.push({
      x: t.c + 0.5, y: t.r + 0.5, tx: target.x, ty: target.y, target: target, ang: 0, trail: [],
      sp: def.sp, type: t.type, dmg: s.dmg, splash: s.splash || 0, slow: s.slow || 1, dur: s.dur || 0

  }

  function hit(p) {
    sfx('h_' + p.type);

      burst(p.tx, p.ty, col.brass, 3, 0.8);
    } else if (p.type === 'topa') {
      enemies.forEach(function (e) {
        if (!e.dead && !e.fly && Math.hypot(e.x - p.tx, e.y - p.ty) <= p.splash + e.r) damage(e, p.dmg);
      });

      enemies.forEach(function (e) {

  function update(dt) {

    enemies.forEach(function (e) {
      if (e.dead) return;

  function drawTower(type, cx, cy, lv, ang, alpha, t, ctx, cs) {

    if (state.over || state.wave >= WAVES) { els.foes.innerHTML = ''; return; }
    var h = '<span class="fc" style="padding:1px 6px;color:var(--brass)">▶ ' + (state.wave + 1) + '</span>';
    waveGroups(state.wave + 1).forEach(function (g) { h += '<span class="fc"><canvas data-foe="' + g.type + '"></canvas>' + g.count + '</span>'; });
    els.foes.innerHTML = h;
    Array.prototype.forEach.call(els.foes.querySelectorAll('canvas'), function (c) { foeIcon(c, c.getAttribute('data-foe')); });
  }

  function paintIcons() {
    Array.prototype.forEach.call(panel.querySelectorAll('canvas.ic'), function (c) {
      var size = parseInt(c.getAttribute('data-size') || '52', 10), d = window.devicePixelRatio || 1;
      c.width = Math.round(size * d); c.height = Math.round(size * d);
      c.style.width = size + 'px'; c.style.height = size + 'px';
      var g = c.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0);
      drawTower(c.getAttribute('data-type'), 0.5, 0.5, parseInt(c.getAttribute('data-lv') || '0', 10), -Math.PI / 4, 1, null, g, size);
    });
  }

  function renderPanel() {
    if (sel) {
      var s = stats(sel), def = TYPES[sel.type], extra = '';
      if (sel.type === 'topa') extra = ' 💥' + s.splash.toFixed(1);
      if (sel.type === 'barf') extra = ' ❄' + Math.round((1 - s.slow) * 100) + '%';
      var nxt = sel.lv < 2 ? def.lv[sel.lv + 1].up : 0;
      panel.innerHTML =
        '<div class="info">' +
        '<canvas class="ic" data-size="40" data-type="' + sel.type + '" data-lv="' + sel.lv + '" aria-label="' + def.name + '"></canvas>' +
        '<div class="body">' +
        '<div class="st"><span class="lv">★' + (sel.lv + 1) + '/3</span> ⚔' + s.dmg + ' ◎' + s.rng.toFixed(1) + ' ⚡' + (1 / s.rate).toFixed(1) + extra + '</div>' +
        '<div class="row">' +
        (sel.lv < 2
          ? '<button class="btn primary" type="button" data-act="up" data-cost="' + nxt + '">⬆ ' + nxt + ' 🪙</button>'
          : '<button class="btn" type="button" disabled>Poora upgrade</button>') +
        '<button class="btn" type="button" data-act="sell">💰 +' + Math.floor(sel.spent * 0.6) + '</button>' +
        '<button class="btn" type="button" data-act="close" aria-label="Band karo">X</button>' +
        '</div></div></div>';
    } else {
      var h = '<div class="towers">';
      Object.keys(TYPES).forEach(function (k) {
        var d = TYPES[k];
        h += '<button class="tw' + (buildType === k ? ' on' : '') + '" type="button" data-act="pick" data-type="' + k + '" data-cost="' + d.cost + '" aria-label="' + d.name + '">' +
          '<canvas class="ic" data-size="32" data-type="' + k + '" data-lv="0"></canvas>' +
          '<span class="cost">' + d.cost + '</span></button>';
      });
      h += '</div>';
      panel.innerHTML = h;
    }
    paintIcons();
    refreshUI(true);
  }

  var lastUI = 0;
  function refreshUI(force) {
    var now = performance.now();
    if (!force && now - lastUI < 120) return;
    lastUI = now;
    els.lives.textContent = state.lives;
    els.gold.textContent = state.gold;
    els.wave.textContent = state.wave + '/' + WAVES;
    els.lvl.textContent = 'Lv ' + level + ' · ' + T.name + ' ' + ['🟢', '🟡', '🟠', '🔴'][Math.min(3, Math.floor((level - 1) / 5))];
    els.pause.textContent = state.paused ? '▶' : '⏸';
    els.spd.textContent = state.speed + 'x';
    
    if (state.over) { els.go.disabled = true; els.go.textContent = '✔'; }
    else if (state.wave >= WAVES) { els.go.disabled = true; els.go.textContent = '⚔'; }
    else if (queue.length) { els.go.disabled = true; els.go.textContent = '⏳'; }
    else { els.go.disabled = false; els.go.textContent = '▶ ' + (state.wave + 1); }
    Array.prototype.forEach.call(panel.querySelectorAll('[data-cost]'), function (b) {
      var poor = state.gold < parseInt(b.getAttribute('data-cost'), 10);
      if (b.classList.contains('tw')) b.classList.toggle('poor', poor);
      else b.disabled = poor;
    });
    var tt = document.getElementById('toast');
    var msg = now < hintUntil ? hintMsg : (pending ? '👆 Dobara tap = tower' : (!towers.length && !state.over ? '👆 Khaali zameen par 2 baar tap karo' : ''));
    tt.textContent = msg; tt.hidden = !msg;
  }

  function openLevels() {
    var grid = document.getElementById('lgrid'), h = '';
    for (var n = 1; n <= TOTAL; n++) {
      h += '<button class="lbtn' + (n === level ? ' cur' : (n < unlocked ? ' done' : '')) + '" type="button" data-lv="' + n + '"' + (n > unlocked ? ' disabled' : '') + '>' + n + '</button>';
    }
    grid.innerHTML = h;
    lvPaused = state.paused; state.paused = true;
    document.getElementById('levels').hidden = false;
    refreshUI(true);
  }
  function closeLevels() {
    state.paused = lvPaused;
    document.getElementById('levels').hidden = true;
    refreshUI(true);
  }

  panel.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act');
    if (act === 'pick') { buildType = b.getAttribute('data-type'); pending = null; renderPanel(); }
    else if (act === 'close') { sel = null; renderPanel(); }
    else if (act === 'up' && sel && sel.lv < 2) {
      var cost = TYPES[sel.type].lv[sel.lv + 1].up;
      if (state.gold >= cost) { state.gold -= cost; sel.spent += cost; sel.lv++; sfx('up'); renderPanel(); }
    } else if (act === 'sell' && sel) {
      state.gold += Math.floor(sel.spent * 0.6); sfx('sell');
      towers.splice(towers.indexOf(sel), 1);
      sel = null; renderPanel();
    }
  });

  cv.addEventListener('pointerdown', function (e) {
    if (state.over || state.paused && !document.getElementById('levels').hidden) return;
    var rc = cv.getBoundingClientRect();
    var c = Math.floor((e.clientX - rc.left) / rc.width * COLS);
    var r = Math.floor((e.clientY - rc.top) / rc.height * ROWS);
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return;
    var t = towerAt(c, r);
    if (t) { sel = t; pending = null; renderPanel(); return; }
    if (isPath(c, r)) { sel = null; pending = null; renderPanel(); return; }
    if (isBlocked(c, r)) { sel = null; pending = null; renderPanel(); hint('Yahan tower nahi ban sakta'); return; }
    if (sel) { sel = null; renderPanel(); }
    if (pending && pending.c === c && pending.r === r) {
      var def = TYPES[buildType];
      if (state.gold < def.cost) { hint('Sona kam hai'); sfx('no'); return; }
      state.gold -= def.cost;
      towers.push({ c: c, r: r, type: buildType, lv: 0, cd: 0, ang: -Math.PI / 2, spent: def.cost, flash: 0, rec: 0 }); sfx('build');
      pending = null;
      refreshUI(true);
    } else {
      pending = { c: c, r: r };
      refreshUI(true);
    }
  });

  els.go.addEventListener('click', startWave);
  els.spd.addEventListener('click', function () { state.speed = state.speed % 3 + 1; refreshUI(true); });
  els.pause.addEventListener('click', function () { if (!state.over) { state.paused = !state.paused; refreshUI(true); } });
  document.getElementById('lvBtn').addEventListener('click', openLevels);
  document.getElementById('lvClose').addEventListener('click', closeLevels);
  document.getElementById('ovLevels').addEventListener('click', openLevels);
  document.getElementById('ovBtn').addEventListener('click', function () {
    if (ovMode === 'next') loadLevel(level + 1);
    else if (ovMode === 'first') loadLevel(1);
    else loadLevel(level);
  });
  document.getElementById('lgrid').addEventListener('click', function (e) {
    var b = e.target.closest('[data-lv]');
    if (!b || b.disabled) return;
    loadLevel(parseInt(b.getAttribute('data-lv'), 10));
  });
  window.addEventListener('resize', resize);
  var sndBtn = document.getElementById('snd');
  sndBtn.textContent = muted ? '🔇' : '🔊';
  sndBtn.addEventListener('click', function () {
    muted = !muted; sndBtn.textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('ghati-mute', muted ? '1' : '0'); } catch (e) { /* ignore */ }
    if (!muted) { actx(); sfx('click'); }
  });
  document.addEventListener('pointerdown', function () { if (!muted) actx(); });
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('.tools .btn, #go, .lbtn, .card .btn, .tw')) sfx('click');
  });
  if (window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('field'));

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!state.paused && !state.over) for (var k = 0; k < state.speed; k++) update(dt);
    draw();
    refreshUI(false);
    requestAnimationFrame(frame);
  }

  resize();
  loadLevel(level);
  requestAnimationFrame(frame);
})();
</script>

</body></html>
